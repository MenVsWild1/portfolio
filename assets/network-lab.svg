<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Network Lab — topology overview</title><desc id="desc">Иллюстрация сетевой лаборатории с узлами, маршрутизацией, клиентами и наблюдаемостью.</desc>
<defs>
