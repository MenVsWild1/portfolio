<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Northstar Agent — local automation workspace</title><desc id="desc">Иллюстрация локального AI-агента с инструментами, журналом действий и подтверждениями.</desc>
<defs>
