<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">CinemaBot — film catalog</title><desc id="desc">Иллюстрация кинокаталога с подборками, карточками и пользовательским голосованием.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111923"/><stop offset="1" stop-color="#18232e"/></linearGradient>
